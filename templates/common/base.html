{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Football Tournament Management System">

<title>
        {% block title %}FTMS{% endblock %}
    </title>

    {# Anti-FOUC: apply saved theme before the page renders to avoid a flash of the wrong theme #}
    <script>
        (function () {
            try {
                if (localStorage.getItem('ftms-theme') === 'light') {
                    document.documentElement.classList.add('light-mode');
                }
            } catch (e) {}
        })();
    </script>

    <link rel="stylesheet"
          href="{% static 'css/base.css' %}">

    {% block extra_css %}{% endblock %}

    <script src="{% static 'js/theme.js' %}" defer></script>

</head>

<body>

    <!-- Navbar -->
    {% include 'common/navbar.html' %}

    <!-- Main Content -->
    <main>

        {% block content %}
        {% endblock %}

    </main>

    <!-- Footer -->
    {% include 'common/footer.html' %}

</body>

</html>
