        </a>
    </div>

    <ul class="nav-links">
        <li>
            <a href="{% url 'home' %}">
                Home
            </a>
        </li>
        <li>

            </a>
        </li>

<div class="nav-buttons">

            </a>

            <a href="{% url 'logout' %}"
               class="admin-btn">

        {% else %}

            <a href="/admin/"
               class="admin-btn">
                ⚙ Admin
            </a>

        {% endif %}

    </div>
