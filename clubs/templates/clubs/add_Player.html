{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FTMS - Add New Player</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .glass-card {
            background: rgba(18, 24, 38, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="bg-cover bg-center bg-no-repeat min-h-screen font-sans text-slate-100" 
      style="background-image: linear-gradient(rgba(11, 15, 26, 0.85), rgba(11, 15, 26, 0.95)), url('{% static "manager_2.webp" %}'); background-attachment: fixed;">

    <main class="max-w-2xl mx-auto px-6 py-12">
        
        <!-- Back Link -->
        <div class="mb-6">
            <a href="{% url 'clubs:manager_dashboard' %}" class="text-sm text-emerald-400 hover:text-emerald-300 transition flex items-center gap-1">
                ⬅️ Back to Dashboard
            </a>
        </div>

        <div class="glass-card rounded-2xl p-8 shadow-2xl">
            <div class="mb-6">
                <h1 class="text-2xl font-black tracking-tight text-white">🏃‍♂️ Register New Player</h1>
                <p class="text-slate-400 text-sm mt-1">Add a new active player profile directly to your club squad roster.</p>
            </div>

            <!-- Messages Alert System -->
            {% if messages %}
                <div class="mb-6 space-y-2">
                    {% for message in messages %}
                        <div class="p-3 rounded-lg text-sm {% if message.tags == 'error' %}bg-rose-500/10 text-rose-400 border border-rose-500/20{% else %}bg-emerald-500/10 text-emerald-400 border border-emerald-500/20{% endif %}">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}

            <form method="POST" action="{% url 'clubs:add_player' %}" class="space-y-5">
                {% csrf_token %}

                <!-- Player Name -->
                <div>
                    <label class="block text-xs uppercase font-bold tracking-wider text-slate-400 mb-2">Player Full Name</label>
                    <input type="text" name="name" placeholder="e.g., Roshan Adhikari" required
                           class="w-full bg-slate-950/50 border border-slate-800 rounded-lg px-4 py-2.5 text-slate-200 focus:outline-none focus:border-emerald-500 transition">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Jersey Number -->
                    <div>
                        <label class="block text-xs uppercase font-bold tracking-wider text-slate-400 mb-2">Jersey Number</label>
                        <input type="number" name="jersey_number" placeholder="e.g., 10" min="1" max="99" required
                               class="w-full bg-slate-950/50 border border-slate-800 rounded-lg px-4 py-2.5 text-slate-200 focus:outline-none focus:border-emerald-500 transition">
                    </div>

                    <!-- Playing Position -->
                    <div>
                        <label class="block text-xs uppercase font-bold tracking-wider text-slate-400 mb-2">Preferred Position</label>
                        <select name="position" required
                                class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-slate-200 focus:outline-none focus:border-emerald-500 transition">
                            <option value="" disabled selected>Select Position</option>
                            <option value="Goalkeeper">Goalkeeper</option>
                            <option value="Defender">Defender</option>
                            <option value="Midfielder">Midfielder</option>
                            <option value="Forward">Forward</option>
                        </select>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="pt-4">
                    <button type="submit" 
                            class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3 rounded-lg text-sm shadow-lg shadow-emerald-500/10 transition uppercase tracking-wider">
                        ✅ Confirm & Add to Squad
                    </button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
