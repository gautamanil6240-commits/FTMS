{% extends 'common/base.html' %}
{% load static %}

{% block extra_css %}
<style>
    .success-box {
        min-height: 60vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 120px 20px 60px;
        background:
            linear-gradient(var(--hero-overlay-a), var(--hero-overlay-b)),
            url('{% static "images/forgot.png" %}') no-repeat center center fixed;
        background-size: cover;
        color: var(--hero-text);
    }

    .success-box h1 {
        font-size: 34px;
        font-weight: 800;
        margin-bottom: 16px;
    }

    .success-box p {
        font-size: 15px;
        color: var(--hero-muted);
        max-width: 480px;
        line-height: 1.7;
        margin-bottom: 24px;
    }

    .login-btn {
        padding: 14px 40px;
        background: var(--accent);
        color: var(--on-accent);
        border: none;
        border-radius: 9px;
        font-size: 15px;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
        transition: all 0.3s;
    }

    .login-btn:hover {
        background: var(--accent-hover);
        transform: translateY(-2px);
        box-shadow: 0 8px 25px var(--accent-glow);
    }
</style>
{% endblock %}

{% block content %}

<div class="success-box">

    <h1>✅ Password Changed</h1>

    <p>
        Your password has been changed successfully.
    </p>

    <a href="{% url 'login' %}" class="login-btn">
        Login Now
    </a>

</div>

{% endblock %}
