{% extends 'common/base.html' %}
{% load static %}

{% block content %}

<link rel="stylesheet" href="{% static 'css/login.css' %}">

<div class="login-page">

    <div class="login-box">

        <h1>{{ role }} Login</h1>

        <form method="POST">

            {% csrf_token %}

            <input type="text"
                   placeholder="Username">

            <input type="password"
                   placeholder="Password">

            <button type="submit">
                Login
            </button>

        </form>

    </div>

</div>

{% endblock %}
