{% extends 'common/base.html' %}
{% load static %}

{% block content %}

<style>

.reset-page{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:120px 20px 40px;

    background:
    linear-gradient(
        rgba(0,0,0,0.75),
        rgba(0,0,0,0.85)
    ),
   url("{% static 'images/forgot.png' %}");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}

.reset-card{

    width:100%;
    max-width:600px;

    background:rgba(15,15,15,0.85);

    backdrop-filter:blur(10px);

    border:1px solid rgba(255,255,255,0.15);

    border-radius:25px;

    padding:45px;

    color:white;

    box-shadow:
    0 10px 40px rgba(0,0,0,.5);
}

.lock-icon{
    font-size:65px;
    text-align:center;
    margin-bottom:10px;
}

.reset-card h2{
    text-align:center;
    font-weight:700;
    margin-bottom:15px;
}

.reset-card p{
    text-align:center;
    color:#d0d0d0;
    margin-bottom:25px;
}

.reset-card label{
    display:block;
    margin-bottom:10px;
    font-weight:600;
}

.reset-card input{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    font-size:16px;
    background:white;
    color:black;
}

.reset-btn{
    width:100%;
    margin-top:20px;
    padding:15px;

    border:none;
    border-radius:12px;

    background:#28a745;

    color:white;
    font-size:17px;
    font-weight:bold;

    cursor:pointer;
}

.reset-btn:hover{
    background:#218838;
}

.back-btn{

    display:block;
    text-align:center;

    margin-top:18px;

    text-decoration:none;

    color:#ffffff;

    padding:12px;

    border-radius:12px;

    border:1px solid rgba(255,255,255,0.2);

    transition:.3s;
}

.back-btn:hover{

    background:rgba(255,255,255,0.1);

    color:white;
}

.ftms-text{
    text-align:center;
    color:#28a745;
    font-weight:bold;
    margin-bottom:15px;
    letter-spacing:2px;
}

</style>

<div class="reset-page">

    <div class="reset-card">

        <div class="ftms-text">
           ⚽ FTMS
        </div>

        <div class="lock-icon">
            🔐
        </div>

        <h2>Forgot Password?</h2>

        <p>
            No worries. Enter your registered email address and
            we'll send you a secure password reset link.
        </p>

        <form method="POST">

            {% csrf_token %}

            {{ form.email.label_tag }}

            {{ form.email }}

            <button type="submit" class="reset-btn">
                Send Reset Link
            </button>

        </form>

        <a href="{% url 'login' %}" class="back-btn">
            ← Back to Login
        </a>

    </div>

</div>

{% endblock %}
