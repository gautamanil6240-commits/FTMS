{% extends 'common/base.html' %}
{% load static %}

{% block extra_css %}
<style>
    .login-page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 120px 20px 60px;
        background:
            linear-gradient(var(--hero-overlay-a), var(--hero-overlay-b)),
            url('{% static "images/forgot.png" %}') no-repeat center center fixed;
        background-size: cover;
    }

    .login-overlay {
        width: 100%;
        display: flex;
        justify-content: center;
    }

    .login-box {
        background: var(--reg-panel);
        border: 1px solid var(--accent-border);
        border-radius: 18px;
        padding: 40px;
        width: 100%;
        max-width: 460px;
        backdrop-filter: blur(16px);
        box-shadow: var(--shadow-rich);
        text-align: center;
    }

    .login-box h1 {
        font-size: 26px;
        font-weight: 700;
        color: var(--hero-text);
        margin-bottom: 22px;
    }

    .login-box form p {
        margin-bottom: 15px;
        color: var(--hero-muted);
        font-size: 13px;
        text-align: left;
    }

    .login-box form label {
        display: block;
        font-size: 11px;
        font-weight: 600;
        color: var(--hero-muted);
        letter-spacing: 1px;
        text-transform: uppercase;
        margin-bottom: 6px;
    }

    .login-box form input {
        width: 100%;
        padding: 13px 16px;
        background: var(--input-transp);
        border: 1px solid var(--input-transp-2);
        border-radius: 9px;
        font-size: 14px;
        color: var(--hero-text);
        outline: none;
        transition: border-color 0.3s;
        box-sizing: border-box;
    }

    .login-box form input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .login-box form ul {
        padding-left: 18px;
        font-size: 12px;
        color: var(--warning);
        margin-top: 4px;
    }

    .login-btn {
        width: 100%;
        padding: 14px;
        margin-top: 10px;
        background: var(--accent);
        color: var(--on-accent);
        border: none;
        border-radius: 9px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s;
    }

    .login-btn:hover {
        background: var(--accent-hover);
        transform: translateY(-2px);
        box-shadow: 0 8px 25px var(--accent-glow);
    }
</style>
{% endblock %}

{% block content %}

<div class="login-page">

    <div class="login-overlay">

        <div class="login-box">

            <h1>🔑 Set New Password</h1>

            <form method="POST">

                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="login-btn">
                    Change Password
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
