{% extends 'common/base.html' %}

{% block content %}

<div class="login-page">

    <div class="login-overlay">

        <div class="login-box">

            <h1>🔑 Set New Password</h1>

            <form method="POST">

                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="login-btn">
                    Change Password
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
