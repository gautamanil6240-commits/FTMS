{% extends 'common/base.html' %}
{% load static %}

{% block extra_css %}
<style>
    .success-box {
        min-height: 60vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 120px 20px 60px;
        background:
            linear-gradient(var(--hero-overlay-a), var(--hero-overlay-b)),
            url('{% static "images/forgot.png" %}') no-repeat center center fixed;
        background-size: cover;
        color: var(--hero-text);
    }

    .success-box h1 {
        font-size: 34px;
        font-weight: 800;
        margin-bottom: 16px;
    }

    .success-box p {
        font-size: 15px;
        color: var(--hero-muted);
        max-width: 480px;
        line-height: 1.7;
    }
</style>
{% endblock %}

{% block content %}

<div class="success-box">

    <h1>📧 Email Sent</h1>

    <p>
        Check your inbox and click the password reset link.
    </p>

</div>

{% endblock %}
