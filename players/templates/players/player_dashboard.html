<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f6f9; color: #333; }
        .card { background: white; padding: 24px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 600px; margin: 0 auto; }
        h1 { color: #1e3a8a; }
        .logout-btn { display: inline-block; background-color: #dc2626; color: white; padding: 10px 16px; text-decoration: none; border-radius: 4px; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Welcome to your Dashboard!</h1>
        <p>You have successfully logged into the Football Tournament Management System.</p>
        <hr>
        <h3>Your Quick Credentials Reminder:</h3>
        <ul>
            <li><strong>Username/Email:</strong> {{ user.email }}</li>
            <li><strong>Account Status:</strong> Active Player</li>
        </ul>
        
        <a href="{% url 'logout' %}" class="logout-btn">Sign Out</a>
    </div>

</body>
</html>
